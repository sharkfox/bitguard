[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bitguard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["click", "pathspec>=0.12", "tqdm"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pre-commit", "ruff", "pylint"]

[tool.pytest.ini_options]
addopts = "--cov=bitguard --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[project.scripts]
bitguard = "bitguard:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bitguard"]

[tool.uv]
package = true
